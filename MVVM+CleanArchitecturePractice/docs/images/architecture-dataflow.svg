<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="da" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#607D8B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="730" fill="#FFFFFF"/>

  <text x="20" y="30" font-size="18" font-weight="700" fill="#212121">検索処理のデータフロー</text>

  <!-- step arrows -->
  <line x1="360" y1="104" x2="360" y2="124" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="168" x2="360" y2="188" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="232" x2="360" y2="252" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="296" x2="360" y2="316" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="360" x2="360" y2="380" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="424" x2="360" y2="444" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="488" x2="360" y2="508" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="360" y1="552" x2="360" y2="572" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>

  <!-- step 1 (user / gray) -->
  <rect x="90" y="60" width="540" height="44" rx="8" fill="#ECEFF1" stroke="#78909C" stroke-width="1.5"/>
  <circle cx="116" cy="82" r="13" fill="#78909C"/>
  <text x="116" y="87" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="142" y="87" font-size="13" fill="#37474F">ユーザーが検索ボタンを押す</text>

  <!-- step 2 (blue) -->
  <rect x="90" y="124" width="540" height="44" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <circle cx="116" cy="146" r="13" fill="#1E88E5"/>
  <text x="116" y="151" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="142" y="151" font-size="13" fill="#0D47A1">HomeViewController — search(query:) を呼ぶ</text>

  <!-- step 3 (blue) -->
  <rect x="90" y="188" width="540" height="44" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <circle cx="116" cy="210" r="13" fill="#1E88E5"/>
  <text x="116" y="215" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="142" y="215" font-size="13" fill="#0D47A1">HomeViewModel — useCase.execute(query:)</text>

  <!-- step 4 (green) -->
  <rect x="90" y="252" width="540" height="44" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="116" cy="274" r="13" fill="#43A047"/>
  <text x="116" y="279" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="142" y="279" font-size="13" fill="#1B5E20">SearchRepositoriesUseCase — Repository へ委譲</text>

  <!-- step 5 (orange) -->
  <rect x="90" y="316" width="540" height="44" rx="8" fill="#FFF8E1" stroke="#FB8C00" stroke-width="1.5"/>
  <circle cx="116" cy="338" r="13" fill="#FB8C00"/>
  <text x="116" y="343" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="142" y="343" font-size="13" fill="#E65100">GitHubRepositoryImpl — apiClient を呼ぶ</text>

  <!-- step 6 (orange) -->
  <rect x="90" y="380" width="540" height="44" rx="8" fill="#FFF8E1" stroke="#FB8C00" stroke-width="1.5"/>
  <circle cx="116" cy="402" r="13" fill="#FB8C00"/>
  <text x="116" y="407" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="142" y="407" font-size="13" fill="#E65100">GitHubAPIClient — GET /search/repositories?q=…</text>

  <!-- step 7 (orange) -->
  <rect x="90" y="444" width="540" height="44" rx="8" fill="#FFF8E1" stroke="#FB8C00" stroke-width="1.5"/>
  <circle cx="116" cy="466" r="13" fill="#FB8C00"/>
  <text x="116" y="471" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="142" y="471" font-size="13" fill="#E65100">JSON を DTO にデコード → toEntity() で Entity に変換</text>

  <!-- step 8 (blue) -->
  <rect x="90" y="508" width="540" height="44" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <circle cx="116" cy="530" r="13" fill="#1E88E5"/>
  <text x="116" y="535" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <text x="142" y="535" font-size="13" fill="#0D47A1">HomeViewModel — @Published repositories を更新</text>

  <!-- step 9 (blue) -->
  <rect x="90" y="572" width="540" height="44" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <circle cx="116" cy="594" r="13" fill="#1E88E5"/>
  <text x="116" y="599" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text>
  <text x="142" y="599" font-size="13" fill="#0D47A1">Combine が通知 → tableView.reloadData()</text>

  <!-- type transformation -->
  <text x="90" y="654" font-size="14" font-weight="700" fill="#212121">型の変化（層をまたぐと型が変わる）</text>

  <rect x="60" y="666" width="120" height="48" rx="8" fill="#ECEFF1" stroke="#78909C" stroke-width="1.5"/>
  <text x="120" y="688" font-size="13" font-weight="600" fill="#37474F" text-anchor="middle">JSON</text>
  <text x="120" y="703" font-size="10" fill="#607D8B" text-anchor="middle">GitHub API</text>

  <rect x="230" y="666" width="120" height="48" rx="8" fill="#FFF8E1" stroke="#FB8C00" stroke-width="1.5"/>
  <text x="290" y="688" font-size="13" font-weight="600" fill="#E65100" text-anchor="middle">DTO</text>
  <text x="290" y="703" font-size="10" fill="#B26A00" text-anchor="middle">Data 層</text>

  <rect x="400" y="666" width="120" height="48" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="460" y="688" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">Entity</text>
  <text x="460" y="703" font-size="10" fill="#4C8C4A" text-anchor="middle">Domain 層</text>

  <rect x="570" y="666" width="110" height="48" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="625" y="688" font-size="13" font-weight="600" fill="#0D47A1" text-anchor="middle">一覧表示</text>
  <text x="625" y="703" font-size="10" fill="#5472A0" text-anchor="middle">Presentation 層</text>

  <line x1="180" y1="690" x2="230" y2="690" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <line x1="350" y1="690" x2="400" y2="690" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
  <text x="375" y="682" font-size="10" fill="#607D8B" text-anchor="middle">toEntity</text>
  <line x1="520" y1="690" x2="570" y2="690" stroke="#607D8B" stroke-width="2" marker-end="url(#da)"/>
</svg>
